# One-off helper: collect candidate pictures for the newest cards/songs into incoming/.
name: Fetch picture candidates
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_candidates.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_candidates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add incoming
          git diff --cached --quiet && exit 0
          git commit -m "Picture candidates for the newest cards and songs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
