# One-off helper: collect holomem chibi images from the official site into incoming/sd.
name: Fetch holomem chibi images
on:
  push:
    paths:
      - scripts/fetch_sd_icons.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_sd_icons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add incoming
          git diff --cached --quiet && exit 0
          git commit -m "Holomem chibi images (official site)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
