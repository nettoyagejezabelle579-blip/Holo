# One-off helper: save score-mechanics guide pages as text into incoming/web.
name: Fetch score guide pages
on:
  push:
    paths:
      - scripts/fetch_web_notes.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_web_notes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add incoming
          git diff --cached --quiet && exit 0
          git commit -m "Score guide pages (text)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
